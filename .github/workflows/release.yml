name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in x.y.z format
        required: true
        type: string
  schedule:
    # Dependabot starts between 06:00 and 06:15 Europe/Zurich every Monday.
    # The daily controller runs well after that window and also picks up later fixes.
    - cron: '30 12 * * *'

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      should_bump: ${{ steps.plan.outputs.should_bump }}
      version: ${{ steps.plan.outputs.version }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      merge_group_shas: ${{ steps.plan.outputs.merge_group_shas }}
      reason: ${{ steps.plan.outputs.reason }}

    steps:
      - name: Check out main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Plan automatic or manual release
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ github.event_name == 'schedule' && 'automatic' || 'manual' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          ARGS=(
            --mode "${RELEASE_MODE}"
            --repo "${GITHUB_REPOSITORY}"
            --quiet-hours 2
          )
          if [[ "${RELEASE_MODE}" = "manual" ]]; then
            ARGS+=(--requested-version "${REQUESTED_VERSION}")
          fi
          node scripts/plan-release.js "${ARGS[@]}"

      - name: Verify exact release candidate checks
        if: steps.plan.outputs.should_release == 'true' && steps.plan.outputs.should_bump == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.plan.outputs.target_sha }}
          MERGE_GROUP_SHAS: ${{ steps.plan.outputs.merge_group_shas }}
        run: |
          node scripts/verify-main-ci.js \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --event push \
            --branch main \
            --sha "${TARGET_SHA}" \
            --required-job "CI Required" \
            --retries 90 \
            --retry-delay-ms 10000

          node scripts/verify-main-ci.js \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow codeql.yml \
            --event push \
            --branch main \
            --sha "${TARGET_SHA}" \
            --required-job "Analyze (javascript-typescript)" \
            --retries 90 \
            --retry-delay-ms 10000

          if [[ -n "${MERGE_GROUP_SHAS}" ]]; then
            IFS=',' read -ra QUEUE_COMMITS <<< "${MERGE_GROUP_SHAS}"
            for QUEUE_COMMIT in "${QUEUE_COMMITS[@]}"; do
              node scripts/verify-main-ci.js \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow ci.yml \
                --event merge_group \
                --no-branch-filter \
                --sha "${QUEUE_COMMIT}" \
                --required-job "security/snyk (roastcodes)" \
                --retries 90 \
                --retry-delay-ms 10000
            done
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      PLANNED_SHOULD_BUMP: ${{ needs.prepare.outputs.should_bump }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TARGET_SHA }}
          persist-credentials: false

      - name: Verify release version input
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          export CURRENT_VERSION
          export RELEASE_VERSION
          export RELEASE_TARGET_SHA
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> "$GITHUB_ENV"
          node - <<'NODE'
          const current = process.env.CURRENT_VERSION
          const requested = process.env.RELEASE_VERSION
          const semverPattern = /^\d+\.\d+\.\d+$/

          if (!semverPattern.test(requested)) {
            throw new Error(`Release version must use x.y.z format. Received: ${requested}`)
          }

          const parse = (value) => value.split('.').map((part) => Number.parseInt(part, 10))
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] > right[index]) return 1
              if (left[index] < right[index]) return -1
            }
            return 0
          }

          if (compare(parse(requested), parse(current)) < 0) {
            throw new Error(`Release version ${requested} must not be lower than current package version ${current}`)
          }
          NODE
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_TARGET_SHA}" ]]; then
            echo "Checked-out commit does not match planned release target ${RELEASE_TARGET_SHA}."
            exit 1
          fi
          echo "RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"
          if [[ "${RELEASE_VERSION}" = "${CURRENT_VERSION}" ]]; then
            if [[ "$(git log -1 --format=%s)" != "v${RELEASE_VERSION}: Release" ]]; then
              echo "Retry target is not the release commit for ${RELEASE_VERSION}."
              exit 1
            fi

            echo "SHOULD_BUMP=false" >> "$GITHUB_ENV"
            echo "Release version already present on main. Continuing in retry mode."
          else
            echo "SHOULD_BUMP=true" >> "$GITHUB_ENV"
          fi

          EXPECTED_SHOULD_BUMP=true
          if [[ "${RELEASE_VERSION}" = "${CURRENT_VERSION}" ]]; then
            EXPECTED_SHOULD_BUMP=false
          fi
          if [[ "${PLANNED_SHOULD_BUMP}" != "${EXPECTED_SHOULD_BUMP}" ]]; then
            echo "Release plan and checked-out package version disagree about whether a bump is required."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Bump package version
        if: env.SHOULD_BUMP == 'true'
        run: npm version "${RELEASE_VERSION}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install documentation dependencies
        run: npm run docs:install

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run docstring lint
        run: npm run lint:docstrings

      - name: Run dependency graph checks
        run: npm run check:deps

      - name: Verify TypeScript toolchain
        run: npm run verify:typescript-toolchain

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run architecture tests
        run: npm run test:architecture

      - name: Run unit and integration tests with coverage
        run: npm run test:unit:coverage

      - name: Build production bundle
        run: npm run build:app

      - name: Verify packed npm artifact
        run: npm run verify:package

      - name: Verify documentation build and publication boundary
        run: npm run docs:verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: npm run test:e2e:ci

      - name: Run documentation browser and accessibility tests
        run: npm run test:docs:e2e:built

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # v3 prefers client-id over the deprecated app-id input.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          repositories: ttdash

      - name: Validate 1Password base URL format
        env:
          OP_SSH_BASE_URL: ${{ secrets.OP_SSH_BASE_URL }}
        run: |
          if [[ ! "${OP_SSH_BASE_URL}" =~ /$ ]]; then
            echo "OP_SSH_BASE_URL must end with a trailing slash, e.g. op://vault/item/"
            exit 1
          fi

      - name: Load release signing secrets
        id: load-release-secrets
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PUBLIC }}
          RELEASE_SIGNER_NAME: ${{ secrets.OP_SSH_BASE_URL }}name
          RELEASE_SIGNER_EMAIL: ${{ secrets.OP_SSH_BASE_URL }}comment
          RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.OP_SSH_BASE_URL }}public key
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.OP_SSH_BASE_URL }}private key?ssh-format=openssh

      - name: Write SSH signing key files
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ steps.load-release-secrets.outputs.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ steps.load-release-secrets.outputs.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-signing"
          printf '%s\n' "${RELEASE_SIGNING_PRIVATE_KEY}" > "${RUNNER_TEMP}/release-signing/signing-key"
          printf '%s\n' "${RELEASE_SIGNING_PUBLIC_KEY}" > "${RUNNER_TEMP}/release-signing/signing-key.pub"
          chmod 600 "${RUNNER_TEMP}/release-signing/signing-key"
          chmod 644 "${RUNNER_TEMP}/release-signing/signing-key.pub"

      - name: Configure git identity and SSH signing
        env:
          RELEASE_SIGNER_NAME: ${{ steps.load-release-secrets.outputs.RELEASE_SIGNER_NAME }}
          RELEASE_SIGNER_EMAIL: ${{ steps.load-release-secrets.outputs.RELEASE_SIGNER_EMAIL }}
        run: |
          git config user.name "${RELEASE_SIGNER_NAME}"
          git config user.email "${RELEASE_SIGNER_EMAIL}"
          git config gpg.format ssh
          git config user.signingkey "${RUNNER_TEMP}/release-signing/signing-key.pub"
          git config commit.gpgsign true
          git config tag.gpgSign true

          printf '%s ' "${RELEASE_SIGNER_EMAIL}" > "${RUNNER_TEMP}/release-signing/allowed-signers"
          cat "${RUNNER_TEMP}/release-signing/signing-key.pub" >> "${RUNNER_TEMP}/release-signing/allowed-signers"
          git config gpg.ssh.allowedSignersFile "${RUNNER_TEMP}/release-signing/allowed-signers"

      - name: Verify SSH signing setup
        run: |
          PROBE_TAG="release-signing-probe-${GITHUB_RUN_ID}"
          git tag -s "${PROBE_TAG}" -m "${PROBE_TAG}"
          git tag -v "${PROBE_TAG}"
          git tag -d "${PROBE_TAG}"

      - name: Configure authenticated remote
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Create signed release commit and tag
        run: |
          git fetch --tags origin
          git fetch --tags origin "${RELEASE_TAG}" >/dev/null 2>&1 || true
          if [[ "${SHOULD_BUMP}" = "true" ]]; then
            git add package.json package-lock.json
            git commit -S \
              -m "v${RELEASE_VERSION}: Release" \
              -m "on-behalf-of: @roastcodes <github@roast.codes>"
            git log -1 --show-signature
          fi

          if git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag -v "${RELEASE_TAG}"
            if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag ${RELEASE_TAG} does not point to the current release commit."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists locally, is signed, and matches HEAD."
          else
            git tag -s "${RELEASE_TAG}" -m "${RELEASE_TAG}"
            git tag -v "${RELEASE_TAG}"
          fi

      - name: Push release commit and tag
        run: |
          if [[ "${SHOULD_BUMP}" = "true" ]]; then
            git fetch origin main
            REMOTE_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
            if [[ "${REMOTE_MAIN_SHA}" != "${RELEASE_TARGET_SHA}" ]]; then
              echo "main moved from ${RELEASE_TARGET_SHA} to ${REMOTE_MAIN_SHA}; release aborted before push."
              exit 1
            fi

            git push --atomic origin \
              HEAD:refs/heads/main \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            echo "Release commit and tag were pushed atomically."
          elif git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q .; then
            git fetch --tags origin "${RELEASE_TAG}" >/dev/null 2>&1 || true
            git tag -v "${RELEASE_TAG}"
            if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Remote tag ${RELEASE_TAG} does not point to the current release commit."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists on origin, is signed, and matches HEAD."
          else
            git push origin "${RELEASE_TAG}"
            echo "Missing retry tag ${RELEASE_TAG} was pushed."
          fi

      - name: Detect existing npm publication
        run: |
          if npm view "@roastcodes/ttdash@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "NPM_VERSION_EXISTS=true" >> "$GITHUB_ENV"
            echo "Package version already exists on npm. Skipping publish."
          else
            echo "NPM_VERSION_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Publish package to npm
        if: env.NPM_VERSION_EXISTS != 'true'
        run: npm publish

      - name: Wait for npm registry propagation
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Checking npm registry propagation (${attempt}/6)."
            if npm view "@roastcodes/ttdash@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Package was not visible on npm in time."
          exit 1

      - name: Verify registry install paths
        run: |
          node scripts/verify-registry-install.js \
            --package @roastcodes/ttdash \
            --version "${RELEASE_VERSION}" \
            --retries 6 \
            --retry-delay-ms 10000

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Skipping creation."
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes
